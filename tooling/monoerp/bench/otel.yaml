# Receives Monospace's OTLP metrics (OTEL=true) and serves them at http://127.0.0.1:18889/metrics.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
exporters:
  prometheus: { endpoint: 0.0.0.0:8889 }
service:
  pipelines:
    metrics: { receivers: [otlp], exporters: [prometheus] }
