# Overlay on docker-compose.yml for a capped benchmark copy of the stack (project
# "monospace-bench", its own volumes and ports, so the dev stack is untouched). Sizes mirror
# staging at lean prod: Monospace 1 vCPU / 2 GB; the two Postgres databases split one
# db.t4g.small (2 vCPU / 2 GB); portal MySQL like a db.t4g.micro. Monospace sees the CPU cap,
# which also sets its Postgres pool (CPU count x 2). netem adds 0.25 ms to every packet Monospace
# sends, roughly an in-VPC round trip. Paths are relative to the repo root.
services:
  monospace:
    cpus: ${MS_CPUS:-1}
    mem_limit: 2g
    environment:
      MONOSPACE_CACHE__ENABLED: 'true'
      MONOSPACE_REDIS__URL: 'redis://valkey:6379'
      MONOSPACE_CACHE__INCLUDE_STATUS_HEADER: 'true'
      MONOSPACE_ENABLE_OTEL_EXPORT: ${OTEL:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel:4318'
      OTEL_TRACES_SAMPLER: 'always_off'
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
      # Starter tier. An empty key fails as "invalid", so drop the variable entirely.
      MONOSPACE_LICENSE__KEY: !reset null
    # Written by bench.sh when THREADS is set; an empty TOKIO_WORKER_THREADS crashes Tokio.
    env_file:
      - path: ./infra/bench/.tokio.env
        required: false
    depends_on:
      valkey: { condition: service_started }
  system-postgres: { cpus: 1, mem_limit: 1g }
  crm-postgres: { cpus: 1, mem_limit: 1g }
  valkey:
    image: valkey/valkey:9
    cpus: 0.5
    mem_limit: 512m
    networks: [monospace]
  netem:
    image: alpine:3.21
    network_mode: 'service:monospace'
    cap_add: [NET_ADMIN]
    command:
      - sh
      - -c
      - apk add -q iproute2-tc && tc qdisc replace dev eth0 root netem delay ${NETEM_DELAY:-0.25ms} && echo netem on && sleep infinity
    depends_on: [monospace]
  otel:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ['--config=/etc/otel.yaml']
    volumes: ['./infra/bench/otel.yaml:/etc/otel.yaml:ro']
    ports: ['127.0.0.1:18889:8889']
    networks: [monospace]
