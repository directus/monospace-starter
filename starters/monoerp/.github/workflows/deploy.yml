# Checks every push and pull request. Pushes to main then deploy staging; version tags (v1.2.3)
# deploy prod. Deploys sign in to AWS through GitHub's OIDC role for the stage, no stored keys;
# setup steps are in infra/aws/README.md ("Automatic deploys").
name: Check and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pieces:check
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @monoerp/web exec playwright install --with-deps chromium
      - run: pnpm --filter @monoerp/web test:browser
      - run: pnpm --filter @monoerp/infra typecheck

  deploy:
    needs: check
    if: github.event_name == 'push'
    # ARM like the Fargate tasks, so images build natively.
    runs-on: ubuntu-24.04-arm
    # Named after the stage: the stage's AWS role only trusts jobs in this environment, and
    # prod's environment is where GitHub asks for approval.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
    # One deploy per stage at a time; a newer push waits rather than cancelling a deploy halfway.
    concurrency:
      group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      STAGE: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
      # The stack reads these every deploy; leaving one out removes what it configures.
      GITHUB_OIDC_SUBJECT: ${{ vars.OIDC_SUBJECT }}
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
      LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
      # Only read on a stage's first deploy.
      MONOSPACE_LICENSE__KEY: ${{ secrets.MONOSPACE_LICENSE__KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: pnpm aws:deploy --stage "$STAGE" --no-input --yes
