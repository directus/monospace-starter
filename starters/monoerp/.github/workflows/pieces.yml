name: Piece combinations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  combinations:
    runs-on: ubuntu-24.04-arm
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - id: list
        run: echo "names=$(node tools/combo.mjs --list)" >> "$GITHUB_OUTPUT"

  prove:
    needs: combinations
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.combinations.outputs.names) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pieces:combo "$COMBINATION"
        env:
          COMBINATION: ${{ matrix.combination }}
