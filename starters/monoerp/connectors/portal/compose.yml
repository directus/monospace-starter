services:
  customer-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CUSTOMER_MYSQL_ROOT_PASSWORD:-monospace}
      MYSQL_DATABASE: customer_portal
      PORTAL_READER_PASSWORD: ${PORTAL_READER_PASSWORD:-monospace}
    ports:
      - '127.0.0.1:${CUSTOMER_MYSQL_PORT:-3306}:3306'
    volumes:
      - customer_mysql_data:/var/lib/mysql
      - ./emulator/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monospace

volumes:
  customer_mysql_data:
