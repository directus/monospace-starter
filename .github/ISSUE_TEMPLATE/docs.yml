name: Documentation Issue
description: Something in the docs is missing, unclear, or incorrect
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      description: Link to the documentation page this relates to.
      placeholder: https://docs.monospace.io/en/...
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type of issue
      options:
        - Incorrect information
        - Missing information
        - Unclear or confusing
        - Broken link or example
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's the issue?
      description: Describe what's wrong or missing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional — how would you improve it?
    validations:
      required: false
