name: Check starters

on:
  push:
    branches: [main]
    paths: ['starters/**', '.changeset/**', 'catalog.json', 'tooling/catalog*.mjs', '.github/workflows/starters.yml']
  pull_request:
    paths: ['starters/**', '.changeset/**', 'catalog.json', 'tooling/catalog*.mjs', '.github/workflows/starters.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04-arm
    outputs:
      starters: ${{ steps.starters.outputs.names }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: node --test tooling/catalog.test.mjs
      - run: node tooling/catalog.mjs --check
      - id: starters
        run: echo "names=$(node -p 'JSON.stringify(require("./catalog.json").starters.map((starter) => starter.id))')" >> "$GITHUB_OUTPUT"

  changeset:
    # The version PR consumes the changesets, so it has none of its own.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails when a starter changed and no changeset covers it.
      - run: npx changeset status --since=origin/${{ github.base_ref }}

  check:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        starter: ${{ fromJSON(needs.discover.outputs.starters) }}
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: starters/${{ matrix.starter }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: starters/${{ matrix.starter }}/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: starters/${{ matrix.starter }}/.node-version
          cache: pnpm
          cache-dependency-path: starters/${{ matrix.starter }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # Browser tests run in any workspace package that depends on Playwright and defines test:browser.
      - id: playwright
        run: |
          pnpm ls -r --depth 0 --json playwright | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync(0, "utf8")).find(
              (pkg) => pkg.dependencies?.playwright ?? pkg.devDependencies?.playwright,
            );
            const playwright = pkg?.dependencies?.playwright ?? pkg?.devDependencies?.playwright;
            if (pkg) console.log(`dir=${pkg.path}\nversion=${playwright.version}`);
          ' >> "$GITHUB_OUTPUT"
      - if: steps.playwright.outputs.version
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright.outputs.version && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C "$PLAYWRIGHT_DIR" exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DIR: ${{ steps.playwright.outputs.dir }}
      - if: steps.playwright.outputs.version && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C "$PLAYWRIGHT_DIR" exec playwright install-deps chromium
        env:
          PLAYWRIGHT_DIR: ${{ steps.playwright.outputs.dir }}
      - if: steps.playwright.outputs.version
        run: pnpm -r --if-present test:browser
